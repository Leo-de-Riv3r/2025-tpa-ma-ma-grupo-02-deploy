spring.application.name=estadisticas

server.port=${PORT:4020}
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

springdoc.api-docs.path=/api-docs
springdoc.info.title="API del servicio de estad�sticas"
springdoc.info.version=1.0.0
springdoc.info.description="Documentaci�n de la API para el servicio de estad�sticas de colecciones."

# Muestra solo los endpoints que comiencen con /api/
springdoc.paths-to-match=/api/**


# Configuraci?n de sincronizaci?n de entities contra la base de datos
spring.jpa.hibernate.ddl-auto=update
# none: no toca la BD.
# validate: valida que las entidades coincidan con la BD.
# update: actualiza la BD seg?n las entidades (muy usado en desarrollo).
# create: crea las tablas en cada inicio.
# create-drop: igual que create pero borra al apagar.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- 1. Exponer Endpoints de Actuator ---
# Exponemos 'prometheus' para que sea "scrapeado" (le�do)
management.endpoints.web.exposure.include=*
# --- 2. Configuraci�n de Tracing (Trazas) ---
management.tracing.enabled=true
management.tracing.sampling.probability=0.5

# Endpoint del colector (Tempo). "localhost:4318" es donde vivir� nuestro Docker
management.zipkin.tracing.endpoint=http://tempo.railway.internal:9411/api/v2/spans
management.endpoint.health.show.details=always
# --- 3. Configuraci�n de M�tricas (Prometheus) ---
# A�adimos el nombre de la app como una etiqueta (tag) a CADA m�trica.
# Esto nos permite filtrar en Grafana: "mu�strame m�tricas de 'mi-modulo-api'"
management.metrics.tags.application=estadisticas

# Config de proms
logging.file.name=./logs/estadisticas.log
# --- 4. Correlaci�n de Logs (�MAGIA!) ---
# A�ade [app_name, traceId, spanId] a cada l�nea de log
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n
management.tracing.propagation.type=B3

management.observations.http.server.requests.ignore-patterns=/actuator/**, /favicon.ico