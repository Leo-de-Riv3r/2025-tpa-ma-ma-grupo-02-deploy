server.port=${PORT:8080}
spring.application.name=ssr
modification.allowance-days=7

# 2. Reemplazar las URLs de localhost con las variables
auth.service.url=${AUTH_URL}/auth
agregador.service.url=${AGREGADOR_URL}
estadisticas.service.url=${ESTADISTICAS_URL}/api/estadisticas
fuenteDinamica.service.url=${FUENTEDINAMICA_URL}
fuenteEstatica.service.url=${FUENTEESTATICA_URL}/api/fuentes
fuenteProxyApi.service.url=${FUENTEPROXY_URL}/api
spring.graphql.client.url=${AGREGADOR_URL}/graphql

# Pon un l�mite grande para videos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=210MB
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}


# --- 1. Exponer Endpoints de Actuator ---
# Exponemos 'prometheus' para que sea "scrapeado" (le�do)
management.endpoints.web.exposure.include=*

# --- 2. Configuraci�n de Tracing (Trazas) ---
management.tracing.enabled=true
management.tracing.sampling.probability=0.5
# Endpoint del colector (Tempo). "localhost:4318" es donde vivir� nuestro Docker
management.zipkin.tracing.endpoint=http://tempo.railway.internal:9411/api/v2/spans
management.endpoint.health.show.details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true


# --- 3. Configuraci�n de M�tricas (Prometheus) ---
# A�adimos el nombre de la app como una etiqueta (tag) a CADA m�trica.
# Esto nos permite filtrar en Grafana: "mu�strame m�tricas de 'mi-modulo-api'"
management.metrics.tags.application=ssr

# --- 4. Correlaci�n de Logs (�MAGIA!) ---
# A�ade [app_name, traceId, spanId] a cada l�nea de log
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n

# Config de proms
logging.file.name=./logs/ssr.log

management.tracing.propagation.type=B3

external.ip-blocker.url=${AUTH_URL}/access/
management.observations.http.server.requests.ignore-patterns=/actuator/**, /favicon.ico
server.forward-headers-strategy=native
