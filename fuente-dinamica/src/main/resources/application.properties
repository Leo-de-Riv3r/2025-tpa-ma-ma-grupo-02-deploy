spring.application.name=fuente-dinamica
server.port=${PORT:4040}
authentication.jwt.secret=9e7830ab97117a8037c8159abdccdb915ccb74957ed96a9d74b4bc115b116db5
modification.allowance-days = 7

# config aws s3
aws.access.key=${AWS_ACCESS}
aws.secret.key=${AWS_SECRET}
aws.region=${AWS_REG}
spring.destination.folder=src/main/resources/static/

# Configuraciï¿½n de la base de datos
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Opcional pero recomendado
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.multimedia.upload-dir=./uploads
app.multimedia.base-path=./uploads

#configuracion de tamaï¿½o de multimedia
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- 1. Exponer Endpoints de Actuator ---
# Exponemos 'prometheus' para que sea "scrapeado" (leï¿½do)
management.endpoints.web.exposure.include=*

# --- 2. Configuraciï¿½n de Tracing (Trazas) ---
management.tracing.enabled=true
management.tracing.sampling.probability=0.5

management.zipkin.tracing.endpoint=http://tempo.railway.internal:9411/api/v2/spans
management.endpoint.health.show.details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Endpoint del colector (Tempo). "localhost:4318" es donde vivirï¿½ nuestro Docker
# --- 3. Configuraciï¿½n de Mï¿½tricas (Prometheus) ---
# Aï¿½adimos el nombre de la app como una etiqueta (tag) a CADA mï¿½trica.
# Esto nos permite filtrar en Grafana: "muï¿½strame mï¿½tricas de 'mi-modulo-api'"
management.metrics.tags.application=fuente-dinamica

# Config de proms
logging.file.name=./logs/fuente-dinamica.log
# --- 4. Correlaciï¿½n de Logs (ï¿½MAGIA!) ---
# Aï¿½ade [app_name, traceId, spanId] a cada lï¿½nea de log
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n
management.tracing.propagation.type=B3
management.observations.http.server.requests.ignore-patterns=/actuator/**, /favicon.ico

#Configuracion eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Opcional: Para que use la IP en lugar del hostname (útil en Docker a veces)
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

